name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'docs/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Build debug APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish public download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MyBubble.apk
          gh release delete latest --cleanup-tag --yes --repo ${{ github.repository }} || true
          gh release create latest MyBubble.apk --repo ${{ github.repository }} --title "MyBubble (latest)" --notes "Newest build of MyBubble." --latest